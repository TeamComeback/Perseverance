name: Manual bets
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: perseverance-data
  cancel-in-progress: false

jobs:
  log:
    # Only bet and saved-prop issues, and only from people with access to the repo.
    if: >-
      (startsWith(github.event.issue.title, 'Bet') || startsWith(github.event.issue.title, 'Save') || startsWith(github.event.issue.title, 'Refresh')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association || github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      # Scheduled runs are pinned to the commit that was current when they were queued. Two runs queued together
      # (GitHub's cron plus the outside timer) then made the second start from stale data and hit a merge conflict
      # when it saved (Nov 13 01:30Z and 03:32Z, Nov 14 03:29Z). `ref: main` starts every run from the current tip.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF reader (official injury report, refresh requests only)
        if: startsWith(github.event.issue.title, 'Refresh')
        run: pip install --quiet pypdf
      - name: Record bet, saved prop, or refresh request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m agent.run manual-issue
      - name: Save books
        run: |
          git config user.name "perseverance-bot"
          git config user.email "perseverance-bot@users.noreply.github.com"
          git add docs/data data/nba data/archive 2>/dev/null || git add docs/data
          git diff --cached --quiet || git commit -m "manual: #${{ github.event.issue.number }}"
          # a concurrent push shouldn't lose this run: replay on the newest main (this run's files win a conflict), retry
          for i in 1 2 3 4; do
            if git pull --rebase -q -X theirs && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done
          echo "could not push after 4 tries"; exit 1
