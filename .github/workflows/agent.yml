name: Agent
on:
  schedule:
    - cron: "5 15 * * *"    # ~11am ET  — morning board
    - cron: "5 20 * * *"    # ~4pm ET   — afternoon / early slate
    - cron: "35 23 * * *"   # ~7:30pm ET — prime-time slate
    - cron: "10 9 * * *"    # ~5am ET   — overnight grading + strategist
    - cron: "5 19 * * *"    # ~2pm ET in winter (3pm in summer) — NBA matchup props, early so plays are ready in the afternoon
    - cron: "17 20 * * *"   # ~3:15pm ET in winter — props backup: only runs if the 2pm run was delayed or dropped
    - cron: "41 13 * * *"   # ~9:40am ET — free research refresh: box scores, lineups, projections, trends
    - cron: "47 20 * * *"   # ~4:45pm ET — free research refresh with updated lineups
  workflow_dispatch:
    inputs:
      mode:
        description: "cycle, props, research or nightly"
        default: cycle
        type: choice
        options: [cycle, props, research, nightly]

permissions:
  contents: write
  issues: write

concurrency:
  group: perseverance-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF reader (official injury report)
        run: pip install --quiet pypdf
      - name: Run agent
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "10 9 * * *") MODE=nightly ;;
              "5 19 * * *") MODE=props ;;
              "17 20 * * *") MODE=props-backup ;;
              "41 13 * * *"|"47 20 * * *") MODE=research ;;
              *) MODE=cycle ;;
            esac
          fi
          python -m agent.run "$MODE"
      - name: Save books
        run: |
          git config user.name "perseverance-bot"
          git config user.email "perseverance-bot@users.noreply.github.com"
          git add docs/data data/nba data/archive
          git diff --cached --quiet || git commit -m "agent: $(date -u +%FT%RZ)"
          git pull --rebase -q && git push
