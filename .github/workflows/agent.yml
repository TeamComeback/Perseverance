name: Agent
on:
  schedule:
    - cron: "5 15 * * *"    # ~11am ET  — morning board
    - cron: "5 20 * * *"    # ~4pm ET   — afternoon / early slate
    - cron: "35 23 * * *"   # ~7:30pm ET — prime-time slate
    - cron: "10 9 * * *"    # ~5am ET   — overnight grading + strategist
    - cron: "5 22 * * *"    # ~6pm ET (5pm in winter) — NBA matchup props, after most injury news
  workflow_dispatch:
    inputs:
      mode:
        description: "cycle, props or nightly"
        default: cycle
        type: choice
        options: [cycle, props, nightly]

permissions:
  contents: write
  issues: write

concurrency:
  group: perseverance-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run agent
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "10 9 * * *") MODE=nightly ;;
              "5 22 * * *") MODE=props ;;
              *) MODE=cycle ;;
            esac
          fi
          python -m agent.run "$MODE"
      - name: Save books
        run: |
          git config user.name "perseverance-bot"
          git config user.email "perseverance-bot@users.noreply.github.com"
          git add docs/data data/nba
          git diff --cached --quiet || git commit -m "agent: $(date -u +%FT%RZ)"
          git pull --rebase -q && git push
