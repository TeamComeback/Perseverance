<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Perseverance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f17; --panel:#121826; --panel2:#182033; --panel3:#1e2840; --line:#232c42; --text:#e7ecf5; --dim:#8a94ab; --dim2:#6b7590;
  --mars:#ADD8E6; --mars-d:#ADD8E622; --win:#3ddc97; --win-d:#3ddc9722; --loss:#ff5d73; --loss-d:#ff5d7322;
  --you:#E5C158; --you-d:#E5C15822; --gold:#E5C158; --gold-d:#E5C15822;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding:max(12px,env(safe-area-inset-top)) 12px calc(132px + env(safe-area-inset-bottom))}
.wrap{max-width:820px;margin:0 auto}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--you)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 12px}
.brand{display:flex;align-items:center;gap:10px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--mars);box-shadow:0 0 14px var(--mars)}
h1{font-size:16px;letter-spacing:.18em;margin:0;font-weight:700}
.tag{font-size:11px;color:var(--dim);border:1px solid var(--line);padding:3px 8px;border-radius:99px;white-space:nowrap}
h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:18px 2px 8px;font-weight:600}

/* bottom tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#0b0f17ee;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{display:flex;gap:4px;max-width:820px;width:100%}
nav.tabs button{flex:1;min-width:0;white-space:nowrap;background:none;border:0;color:var(--dim);font:inherit;font-size:10.5px;font-weight:600;padding:6px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--text);background:var(--panel)}
nav.tabs button.on svg{stroke:var(--mars)}
.view{display:none} .view.on{display:block}

.race{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.race{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card.agent{border-top:3px solid var(--mars)} .card.you{border-top:3px solid var(--you)}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.big{font-size:30px;font-weight:700;margin:2px 0 8px}
.track{position:relative;height:8px;background:var(--panel2);border-radius:99px;margin:6px 0 4px}
.fill{height:100%;border-radius:99px}
.tick{position:absolute;top:-3px;width:1px;height:14px;background:var(--line)}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--dim)}
.row{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--dim)}
.row b{color:var(--text);font-weight:600}
.mbar{position:relative;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}.mbar:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}.mbar span{position:absolute;top:0;bottom:0;background:var(--dim2)}.mbar span.up{background:var(--win)}.mbar span.dn{background:var(--loss)}.mff td,.mff th{font-size:12px}.mbar2{position:relative;height:7px;background:var(--panel2);border-radius:4px;overflow:hidden}.mbar2:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}.mbar2 span{position:absolute;top:0;bottom:0;opacity:.9}.mfav{font-size:11px;margin-top:3px;white-space:nowrap}.tchip{font-size:10.5px;border:1px solid;border-radius:5px;padding:0 4px;letter-spacing:.03em}.ffnet{margin:10px 0 4px;font-size:13px}
.pos{color:var(--win)} .neg{color:var(--loss)} .gold{color:var(--gold)} .dim{color:var(--dim)}
.chart{margin-top:10px} .chart svg{width:100%;height:130px;display:block}

/* collapsible sections */
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden}
details.sec>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600}
details.sec>summary::-webkit-details-marker{display:none}
summary .meta{font-weight:500;font-size:12px;color:var(--dim);text-align:right}
details>summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);transform:rotate(45deg);margin-left:4px;transition:transform .2s;flex:none}
details[open]>summary::after{transform:rotate(-135deg)}
.body{padding:0 14px 14px}
details.sub{border-top:1px solid var(--line);margin:0 -14px;padding:0 14px}
details.sub>summary{list-style:none;cursor:pointer;padding:11px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;font-size:14px}
details.sub>summary::-webkit-details-marker{display:none}
details.sub .sb{padding-bottom:12px}

.bet{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.bet:first-child{border-top:0}
.bet .what{font-weight:600}
.bet .sub{font-size:12px;color:var(--dim);grid-column:1}
.bet .amt{text-align:right;font-family:var(--mono);font-size:13px}
.pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:99px;background:var(--panel2);color:var(--dim);margin-right:4px;letter-spacing:.04em;vertical-align:1px;font-weight:600}
.pill.won,.pill.hit{background:var(--win-d);color:var(--win)} .pill.lost,.pill.miss{background:var(--loss-d);color:var(--loss)}
.pill.arb{background:var(--gold-d);color:var(--gold)} .pill.mars{background:var(--mars-d);color:var(--mars)} .pill.you{background:var(--you-d);color:var(--you)}
.pill.live{background:var(--loss-d);color:var(--loss)} .pill.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--loss);margin-right:5px;animation:pulse 1.4s infinite}
.pill.fin{background:var(--panel);color:var(--text)}
@keyframes pulse{50%{opacity:.25}}
.empty{color:var(--dim);font-size:13px;padding:6px 0}
.note{font-size:12px;color:var(--dim);margin-top:16px;text-align:center}
.desc{font-size:12px;color:var(--dim)}
.btn{display:inline-block;background:var(--you);color:#0b0f17;font-weight:700;text-decoration:none;padding:9px 13px;border-radius:10px;border:0;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.mars{background:var(--mars)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}

.chips{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin:0 -2px 8px;padding:0 2px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button,.seg button{background:var(--panel2);color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:6px 11px;font:inherit;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer}
.chips button.on{color:var(--text);border-color:var(--mars);background:var(--mars-d)}
.chips button.w{color:var(--win);border-color:#3ddc9788;background:var(--win-d)}
.chips button.wo{color:var(--loss);border-color:#ff5d7388;background:var(--loss-d)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--panel2)}
.seg button.on{background:var(--panel3);color:var(--text)}
input.search{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;margin-bottom:8px}
.lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);margin:8px 0 5px}

/* game cards */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.gcard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px;cursor:pointer}
.gcard .m{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.gcard .t{font-size:12px;color:var(--dim)}
.gcard .mdl{font-size:12px;color:var(--dim);margin-top:6px;font-family:var(--mono)}
.gs .gs-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;min-height:18px}
.gs-r{display:flex;align-items:baseline;gap:8px;padding:2px 0;font-size:15px}
.gs-r .ab{font-weight:800;width:44px}.gs-r .nm{flex:1;color:var(--dim);font-size:13px}.gs-r .sc{font-family:var(--mono);font-weight:700;font-size:17px}
.gs-r.l{opacity:.55}.gs-r.w .sc{color:var(--gold)}
.gh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.gh-t .ab{font-size:20px;font-weight:800}.gh-t .nm{font-size:12px;color:var(--dim)}.gh-t .rec{font-size:11px;color:var(--dim2)}
.gh-s .sc{font-family:var(--mono);font-size:30px;font-weight:800;white-space:nowrap}.gh-s .st{font-size:12px;color:var(--dim);margin-top:2px}
.gcard ul{margin:6px 0 0;padding-left:16px;font-size:12px;color:var(--dim)}

/* prop list */
.pr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.pr:first-child{border-top:0}
.pr .nm{font-weight:700}
.pr .gm{font-size:12px;color:var(--dim)}
.pr .rt{text-align:right;font-family:var(--mono);font-size:13px;white-space:nowrap}
.pr .ln{grid-column:1/-1;font-size:12px;color:var(--dim)}
.lean{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:6px;letter-spacing:.04em;vertical-align:1px}
.lean.Over{background:var(--win-d);color:var(--win)} .lean.Under{background:var(--loss-d);color:var(--loss)}
.st{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:5px;vertical-align:1px;border:1px solid var(--line);color:var(--dim)}
.st.s{color:var(--win);border-color:#3ddc9755} .st.q{color:var(--gold);border-color:#E5C15855} .st.o{color:var(--loss);border-color:#ff5d7355}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600;text-align:right;padding:6px 5px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:6px 5px;border-bottom:1px solid #1a2134;text-align:right;font-family:var(--mono);white-space:nowrap}
.tbl td.t{font-family:inherit}
.tbl tr.hl td{background:#ADD8E612}
.scroll{overflow-x:auto;margin:0 -14px;padding:0 14px}
td.h{color:var(--win)} td.m{color:var(--loss)}

/* trend items */
.ti{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.ti:first-child{border-top:0}
.ti b{font-family:var(--mono);white-space:nowrap}
.ti b.good{color:var(--win)} .ti b.bad{color:var(--loss)} .ti b.mid{color:var(--gold)}
.hbar{height:6px;background:var(--panel2);border-radius:99px;position:relative;margin-top:4px}
.hbar i{position:absolute;top:0;bottom:0;border-radius:99px}
.hbar .c{position:absolute;left:50%;top:-3px;width:1px;height:12px;background:var(--dim2)}

/* player sheet */
.sheet{position:fixed;inset:0;z-index:50;background:#05070bcc;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .pane{background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:820px;height:94vh;overflow-y:auto;
  padding:0 14px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet .hd{position:sticky;top:0;background:var(--bg);z-index:2;padding:12px 0 8px;border-bottom:1px solid var(--line);margin-bottom:10px}
.sheet .hd .x{float:right;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:99px;width:32px;height:32px;font-size:18px;line-height:1;cursor:pointer}
.sheet .name{font-size:20px;font-weight:700}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin:8px 0}
.kv>div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.kv .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.kv .v{font-family:var(--mono);font-weight:700;font-size:15px}
.kv .v small{font-size:11px;color:var(--dim);font-weight:500}
.lineset{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.lineset .step{background:var(--panel2);border:1px solid var(--line);color:var(--text);width:34px;height:34px;border-radius:10px;font-size:18px;cursor:pointer}
.lineset .val{font-family:var(--mono);font-size:20px;font-weight:700;min-width:58px;text-align:center}
.bars svg{width:100%;height:150px;display:block}
.court svg{width:100%;max-width:420px;display:block;margin:0 auto}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:8px}
.zones div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:12px}
.zones b{font-family:var(--mono)}
ul.sig{margin:4px 0 0;padding-left:16px;font-size:13px;color:var(--dim)} ul.sig li{margin:3px 0}

/* live + reviews (from the earlier dashboard) */
.lv{grid-column:1/-1;margin-top:8px;background:var(--panel2);border-radius:10px;padding:9px 10px}
.lv .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.lv .t .sc{font-family:var(--mono);font-weight:700;white-space:nowrap}
.lv .t .st2{color:var(--dim);font-size:12px}
.lv .s{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-top:5px;color:var(--dim)}
.lv .s b{font-weight:600}
.lv .tone-win{color:var(--win)} .lv .tone-lose{color:var(--loss)} .lv .tone-even{color:var(--gold)}
.pbar{height:6px;background:#0b0f17;border-radius:99px;margin-top:7px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--dim);transition:width .6s}
.pbar.win i{background:var(--win)} .pbar.lose i{background:var(--loss)} .pbar.even i{background:var(--gold)}
.sbar{height:6px;background:#0b0f17;border-radius:99px;margin-top:5px;position:relative}
.sbar i{display:block;height:100%;border-radius:99px;background:var(--you);transition:width .6s}
.sbar u{position:absolute;top:-3px;width:2px;height:12px;background:var(--text);border-radius:1px}
.sbar.win i{background:var(--win)} .sbar.lose i{background:var(--loss)}
.lv .leg{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)} .lv .leg:first-child{margin-top:0;padding-top:0;border-top:0}
.rv{grid-column:1/-1;margin-top:6px;background:var(--panel2);border-radius:10px;padding:9px 10px;font-size:12.5px}
.rv .fin{font-weight:600;font-size:13px}
.rv ul{margin:6px 0 0;padding-left:16px;color:var(--dim)} .rv li{margin:3px 0}
.rv details{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.rv details>summary{list-style:none;cursor:pointer;font-weight:600;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;color:var(--text)}
.rv details>summary::-webkit-details-marker{display:none}
.rv .q{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;margin:6px 0}
.rv .q td,.rv .q th{padding:3px 5px;text-align:right;border-bottom:1px solid var(--line)} .rv .q th{color:var(--dim);font-weight:600}
.rv .q td:first-child,.rv .q th:first-child{text-align:left}
.tg{display:inline-block;font-size:10px;padding:2px 7px;border-radius:99px;margin:0 4px 4px 0;background:var(--panel);color:var(--dim);border:1px solid var(--line)}
.tg.good{color:var(--win);border-color:#3ddc9755} .tg.bad{color:var(--loss);border-color:#ff5d7355} .tg.mid{color:var(--gold);border-color:#E5C15855}
.tl{border-left:2px solid var(--line);margin-left:4px;padding-left:14px}
.tl .e{position:relative;padding:7px 0;font-size:13px}
.tl .e::before{content:"";position:absolute;left:-20px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--mars)}
.tl .e.you::before{border-color:var(--you)} .tl .e.won::before{border-color:var(--win);background:var(--win)} .tl .e.lost::before{border-color:var(--loss);background:var(--loss)} .tl .e.push::before{border-color:var(--dim)}
.tl time{display:block;font-size:11px;color:var(--dim)}
.tl .e span.r{float:right;font-family:var(--mono);font-size:12px}
.ev{padding:12px 0;border-top:1px solid var(--line)} .ev:first-child{border-top:0}
.ev .h{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:6px}
.ev .h span{color:var(--dim);white-space:nowrap}
.mk{font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin:6px 0 4px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}
a.opt{display:block;text-decoration:none;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
a.opt.plus{border-color:#3ddc9766}
a.opt .n{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.opt .o{font-family:var(--mono);font-weight:700}
a.opt .b{font-size:10px;color:var(--dim)}
.meter{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--win),var(--gold))}
.params{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.param{background:var(--panel2);border-radius:10px;padding:8px 10px}
.param .v{font-family:var(--mono);font-size:15px;font-weight:700}
.log{border-left:2px solid var(--line);padding-left:12px}
.log div{padding:6px 0;font-size:13px}
.log time{display:block;font-size:11px;color:var(--dim)}
.arm{padding:10px 0;border-top:1px solid var(--line)} .arm:first-child{border-top:0}
.arm .top{display:flex;justify-content:space-between;gap:8px}
.wbar{height:5px;background:var(--panel2);border-radius:99px;margin-top:6px;position:relative}
.wbar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--mars)}
.wbar .mid{position:absolute;left:62.5%;top:-3px;width:1px;height:11px;background:var(--dim)}
.fab{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:31;background:var(--mars);color:#0b0f17;font-weight:800;border:0;border-radius:99px;padding:12px 16px;font:inherit;font-weight:800;box-shadow:0 6px 20px #0008;display:flex;align-items:center;gap:6px;cursor:pointer}
.fab:active{transform:scale(.97)}
.fm{display:grid;gap:10px;margin-top:6px}
.fm label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.fm input,.fm select,.fm textarea{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px}
.fm .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px}
.seg button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:10px;font:inherit;font-weight:700;cursor:pointer}
.seg button.on{color:var(--text);border-color:var(--mars);background:var(--panel2)}

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = (v, sign) => (sign && v > 0 ? "+" : v < 0 ? "−" : "") + "$" + Math.abs(v).toFixed(2);
const pct = (v, d=1) => v == null ? "—" : (v > 0 ? "+" : "") + (v*100).toFixed(d) + "%";
const pl = (v, d=1) => (v*100).toFixed(d) + "%";
const am = d => d >= 2 ? "+" + Math.round((d-1)*100) : "−" + Math.round(100/(d-1));
const amS = a => (a > 0 ? "+" : "") + a;
const cls = v => v > 0 ? "pos" : v < 0 ? "neg" : "";
const f1 = v => v == null ? "—" : (Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v)) : v.toFixed(1));
const SPORT = k => ({americanfootball_nfl:"NFL",americanfootball_ncaaf:"NCAAF",basketball_nba:"NBA",basketball_ncaab:"NCAAB",basketball_wnba:"WNBA",icehockey_nhl:"NHL",baseball_mlb:"MLB",soccer_epl:"EPL",soccer_uefa_champs_league:"UCL",soccer_usa_mls:"MLS",mma_mixed_martial_arts:"UFC"}[k] || (k||"").split("_").slice(-1)[0].toUpperCase());
const MK = {h2h:"Moneyline", spreads:"Spread", totals:"Total", team_totals:"Team total", custom:"Custom", player_points:"Points", player_rebounds:"Rebounds",
  player_assists:"Assists", player_threes:"Threes", player_points_rebounds_assists:"Pts+Reb+Ast", player_rebounds_assists:"Reb+Ast"};
const BOOKN = {draftkings:"DraftKings", fanduel:"FanDuel", williamhill_us:"Caesars", caesars:"Caesars", betmgm:"BetMGM", betrivers:"BetRivers",
  fanatics:"Fanatics", espnbet:"theScore Bet", hardrockbet:"Hard Rock", kalshi:"Kalshi", polymarket_us:"Polymarket", ballybet:"Bally Bet"};
const bookName = k => BOOKN[k] || k || "";
const PB = {value_fav:"Value · favorite", value_dog:"Value · underdog", longshot:"Longshot", arb:"Arbitrage", parlay_ev:"+EV parlay",
  matchup_over:"Matchup · over", matchup_under:"Matchup · under", manual:"Yours"};
const STATN = {ra:"R+A", ast:"AST", tpm:"3PM", pra:"PRA", pts:"PTS", reb:"REB"};
const STATL = {ra:"Rebounds + assists", ast:"Assists", tpm:"Threes made", pra:"Pts + reb + ast", pts:"Points", reb:"Rebounds"};
const PROP_STATS = ["ra", "ast", "tpm", "pra"], ALL_STATS = ["ra", "ast", "tpm", "pra", "pts", "reb"];
const ODDS_KEY = {pts:"player_points", reb:"player_rebounds", ast:"player_assists", tpm:"player_threes", pra:"player_points_rebounds_assists", ra:"player_rebounds_assists"};
const when = ts => new Date(ts).toLocaleString([], {weekday:"short", hour:"numeric", minute:"2-digit"});
const tod = ts => new Date(ts).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
const ago = ts => { const m = Math.max(0, (Date.now() - new Date(ts)) / 60000); return m < 1 ? "just now" : m < 60 ? Math.round(m) + "m ago" : m < 1440 ? Math.round(m/60) + "h ago" : Math.round(m/1440) + "d ago"; };
const md = d => { const [y, m, dd] = d.split("-"); return +m + "/" + +dd; };
const seasonLbl = s => (s - 1) + "-" + String(s).slice(2);

const OWNER = location.hostname.endsWith("github.io") ? location.hostname.split(".")[0] : "TeamComeback";
const REPO = location.hostname.endsWith("github.io") ? (location.pathname.split("/")[1] || "Perseverance") : "Perseverance";

const store = {get(k, d) { try { const v = localStorage.getItem("pz-" + k); return v == null ? d : JSON.parse(v); } catch(e) { return d; } },
               set(k, v) { try { localStorage.setItem("pz-" + k, JSON.stringify(v)); } catch(e) {} }};

// collapsible section; remembers open/closed per id
function sec(id, title, meta, body, open=false) {
  const o = store.get("o-" + id, open);
  return `<details class="sec" data-id="${id}" ${o ? "open" : ""}><summary><span>${title}</span><span class="meta" id="m-${id}">${meta || ""}</span></summary><div class="body" id="b-${id}">${body}</div></details>`;
}
function sub(id, title, meta, body, open=false) {
  const o = store.get("o-" + id, open);
  return `<details class="sub" data-id="${id}" ${o ? "open" : ""}><summary><span>${title}</span><span class="meta">${meta || ""}</span></summary><div class="sb">${body}</div></details>`;
}
// ===================================================== YOUR LEDGER (stored in this app, not GitHub)
// Your bets and saved props live in this browser's storage (localStorage, mirrored to IndexedDB),
// like Ingenuity. Bets grade themselves in the app from ESPN box scores. Export/Restore makes a
// backup file you keep in iCloud Drive, because iOS can clear website storage.
const LKEY = "pz-ledger-v1";
const MIN_STAKE = 5, START = 100, GOAL = 1000;
const newBook = (run = 1) => ({name: "Your book", run, cash: START, start: START, goal: GOAL, peak: START, status: "racing",
  started: new Date().toISOString(), bets: [], runs: []});
let L = null;
const idb = (() => {
  let p = null;
  const open = () => p || (p = new Promise((res, rej) => {
    try { const r = indexedDB.open("perseverance", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
    catch (e) { rej(e); }
  }));
  return {
    async get(k) { try { const db = await open(); return await new Promise(res => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch (e) { return null; } },
    async set(k, v) { try { const db = await open(); db.transaction("kv", "readwrite").objectStore("kv").put(v, k); } catch (e) {} }
  };
})();
function saveL() {
  L.updated = new Date().toISOString();
  const s = JSON.stringify(L);
  try { localStorage.setItem(LKEY, s); } catch (e) {}
  idb.set(LKEY, s);
}
async function loadL(repoManual) {
  let raw = null;
  try { raw = localStorage.getItem(LKEY); } catch (e) {}
  if (!raw) raw = await idb.get(LKEY);          // localStorage was cleared: fall back to the IndexedDB copy
  try { L = raw ? JSON.parse(raw) : null; } catch (e) { L = null; }
  if (!L) {
    L = {v: 1, book: newBook(), saved: [], hist: []};
    // one-time import of anything logged earlier through GitHub issues
    const old = (repoManual && repoManual.book && repoManual.book.bets) || [];
    if (old.length) { L.book = repoManual.book; }
    const oldSaved = (D.repoSaved && D.repoSaved.items) || [];
    L.saved = oldSaved.map(x => ({...x, id: x.id || "s" + (x.issue || Math.random().toString(36).slice(2, 8))}));
    saveL();
  }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  syncManual();
}
const lid = () => Math.random().toString(36).slice(2, 10);
const equityOf = book => Math.round((book.cash + book.bets.filter(b => b.status === "open").reduce((s, b) => s + b.stake, 0)) * 100) / 100;
function statsOf(book) {
  const st = book.bets.filter(b => ["won", "lost", "push"].includes(b.status));
  const staked = st.reduce((s, b) => s + b.stake, 0), profit = st.reduce((s, b) => s + b.profit, 0);
  return {bets: st.length, won: st.filter(b => b.status === "won").length, lost: st.filter(b => b.status === "lost").length,
    push: st.filter(b => b.status === "push").length, staked, profit: Math.round(profit * 100) / 100, roi: staked ? profit / staked : 0,
    clv: null, open: book.bets.filter(b => b.status === "open").length, equity: equityOf(book)};
}
function syncManual() { D.manual = {book: L.book, stats: statsOf(L.book)}; }
function histPoint() { L.hist.push({ts: new Date().toISOString(), eq: equityOf(L.book)}); L.hist = L.hist.slice(-2000); }

function placeBet(legs, stake, note) {
  const book = L.book;
  stake = Math.round(Math.min(stake, book.cash) * 100) / 100;
  if (stake < MIN_STAKE) return {err: book.cash < MIN_STAKE ? `Not enough fake cash: you have ${money(book.cash)}.` : "Minimum bet is $5."};
  const dec = Math.round(legs.reduce((d, l) => d * l.price, 1) * 1000) / 1000;
  const b = {id: lid(), placed: new Date().toISOString(), run: book.run, source: "you", playbook: "manual", legs, dec, stake,
    ev: null, p: null, note: note || "", status: "open", payout: null, profit: null, settled: null};
  book.cash = Math.round((book.cash - stake) * 100) / 100;
  book.bets.push(b); histPoint(); saveL(); syncManual();
  return {bet: b};
}
function settleBet(b, result) {
  const book = L.book;
  if (b.status !== "open") return;
  let mult;
  if (result === "cancel") { mult = 1; }
  else if (result) { mult = {won: b.dec, lost: 0, push: 1}[result]; }
  else {
    const rs = b.legs.map(l => l.result);
    if (rs.includes("loss")) { result = "lost"; mult = 0; }
    else if (rs.includes(null) || rs.includes(undefined)) return false;
    else { mult = b.legs.reduce((m, l) => m * (l.result === "win" ? l.price : 1), 1); result = rs.every(r => r === "push" || r === "void") ? "push" : "won"; }
  }
  const payout = Math.round(b.stake * mult * 100) / 100;
  Object.assign(b, {status: result === "cancel" ? "cancelled" : result, payout, profit: Math.round((payout - b.stake) * 100) / 100, settled: new Date().toISOString()});
  if (result !== "cancel") b.review = reviewLocal(b);
  book.cash = Math.round((book.cash + payout) * 100) / 100;
  book.peak = Math.max(book.peak, equityOf(book));
  checkRace(); histPoint(); saveL(); syncManual();
  return true;
}
function checkRace() {
  const book = L.book, eq = equityOf(book), open = book.bets.some(b => b.status === "open");
  const done = eq >= book.goal && !open ? "won" : book.cash < MIN_STAKE && !open ? "busted" : null;
  if (!done) return;
  book.runs.push({run: book.run, result: done, started: book.started, ended: new Date().toISOString(), final: eq, peak: book.peak,
    bets: book.bets.filter(b => b.run === book.run).length});
  Object.assign(book, {run: book.run + 1, cash: START, peak: START, status: "racing", started: new Date().toISOString()});
  toast(done === "won" ? "You hit $1,000! New run started from $100." : "Run busted. New run started from $100.");
}

// ---- grading in the app (free ESPN data, same feed the live tracker uses) ----
function gradeGameLeg(l, g) {
  const hs = g.home.score, as = g.away.score;
  if (l.market === "team_totals") {
    const t = sameTeam(l.team, g.home) ? hs : sameTeam(l.team, g.away) ? as : null; if (t == null) return null;
    const d = l.outcome === "Over" ? t - l.point : l.point - t; return d > 0 ? "win" : d < 0 ? "loss" : "push";
  }
  if (l.market === "totals") { const d = l.outcome === "Over" ? hs + as - l.point : l.point - hs - as; return d > 0 ? "win" : d < 0 ? "loss" : "push"; }
  if (l.outcome === "Draw") return hs === as ? "win" : "loss";
  const home = sameTeam(l.outcome, g.home), away = sameTeam(l.outcome, g.away);
  if (!home && !away) return null;
  const mine = home ? hs : as, theirs = home ? as : hs;
  if (l.market === "h2h" && mine === theirs) return (l.sport || "").startsWith("soccer") ? "loss" : "push";
  const d = mine + (l.market === "spreads" ? (l.point || 0) : 0) - theirs;
  return d > 0 ? "win" : d < 0 ? "loss" : "push";
}
async function gradeLeg(l) {
  if (l.result != null || l.market === "custom" || !l.sport || !l.commence) return false;
  const start = new Date(l.commence).getTime();
  if (Date.now() < start + 2.5 * 3600e3) return false;
  const tooOld = Date.now() > start + 4 * 86400e3;
  if (l.stat) {
    const sm = l.espn_id ? await summary(l.sport, l.espn_id) : null;
    if (!sm || sm.g.state !== "post") { if (tooOld) { l.result = "void"; return true; } return false; }
    let row = sm.players[l.player_id];
    if (!row) row = Object.values(sm.players).find(r => normName(r._n) === normName(l.player));
    l.final = {home: sm.g.home.score, away: sm.g.away.score, ha: sm.g.home.abbr, aa: sm.g.away.abbr, ls: sm.ls};
    if (!row || !(parseFloat(row.MIN) > 0)) { l.result = "void"; return true; }
    const v = statVal(row, l.stat); l.actual = v;
    l.box = {min: row.MIN, pts: row.PTS, reb: row.REB, ast: row.AST, tp: row["3PT"], fg: row.FG, pf: row.PF};
    const d = l.side === "Over" ? v - l.point : l.point - v;
    l.result = d > 0 ? "win" : d < 0 ? "loss" : "push";
    return true;
  }

function propRows() {

        status: p.status, starter: p.starter, lineup: p.lineup, stat: s, proj, base, mult, sd, lean: mult > 1 ? "Over" : "Under",
        espn_id: p.game, state: p.state, strength: Math.abs(Math.log(mult)), dvp: p.dvp[s], cv: (p.cv || {})[s], b2b: p.b2b};
      const sp = spots[p.pid + "|" + s]; if (sp) row.signals = sp.signals;

// one row per player: his best stat by the given score; remembers how many other stats he had
function onePerPlayer(rows, score) {
  const by = {};
  rows.forEach(r => { const b = by[r.pid]; if (!b) by[r.pid] = {best: r, n: 1}; else { b.n++; if (score(r) > score(b.best)) b.best = r; } });
  return Object.values(by).map(x => ({...x.best, more: x.n - 1})).sort((a, b) => score(b) - score(a));

// Conviction, 1-5. Built from things that have to line up for a matchup play to be trustworthy:
//  matchup size (0-3: cutoffs sit near the top 3% / 12% / 35% of the slate), the separate signals agreeing (+1),
//  a secure role (+1 starter or 26+ min, -1 if questionable), and the price when there is one (+1 edge >= 5%, -1 no edge).
function rating(x) {
  let pts, why;
  if (x.cv) { pts = x.cv[0]; why = x.cv[1] ? x.cv[1].split(" · ") : []; }
  else {
    const st = x.strength;
    pts = st >= 0.08 ? 3 : st >= 0.055 ? 2 : st >= 0.035 ? 1 : 0;
    why = [st >= 0.055 ? "big matchup effect" : st >= 0.035 ? "moderate matchup" : "small matchup effect"];
    const up = x.mult > 1, sig = (x.signals || []).filter(g => g.v != null && ["dvp", "sim", "h2h"].includes(g.k) && (g.k !== "h2h" || (g.n || 0) >= 2));

    const stt = (x.status || "").toLowerCase();
    if (/quest|gtd|doubt|day-to-day|day to day/.test(stt)) { pts--; why.push("injury tag"); }
    else if (x.starter || x.minutes >= 26) { pts++; why.push("secure minutes"); }
  }
  if (x.line != null) {
    if (x.ev >= 0.05) { pts++; why.push("priced edge"); } else if (!(x.ev > 0)) { pts--; why.push("no edge at this price"); }
    if (x.open != null && x.open !== x.line) { const tw = (x.line > x.open) === (x.mult > 1); pts += tw ? 1 : -1; why.push(tw ? "line moving his way" : "line moving against him"); }
  }

function runTimes() {
  const n = new Date(), out = [];
  for (const dd of [-1, 0, 1]) {
    const at = (h, m) => Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate() + dd, h, m);
    SCHED.forEach(([h, m, name]) => out.push([at(h, m), name]));
    for (let h = 18; h <= 23; h++) [3, 33].forEach(m => out.push([at(h, m), "Injury watch"]));
    for (let h = 0; h <= 5; h++) [7, 22, 37, 52].forEach(m => out.push([at(h, m), "Live lines + injury watch"]));
  }
  return out.sort((a, b) => a[0] - b[0]);
}
function tickClock() {
  const el = $("rcT"); if (!el) return;
  const now = Date.now(), T = runTimes(), nx = T.find(t => t[0] > now), pv = [...T].reverse().find(t => t[0] <= now);
  if (!nx) return;
  const left = Math.max(0, Math.floor((nx[0] - now) / 1000)), h = Math.floor(left / 3600), m = Math.floor(left % 3600 / 60), sc = left % 60;
  el.textContent = [h, m, sc].map(x => String(x).padStart(2, "0")).join(":");
  $("rcWhen").textContent = new Date(nx[0]).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
  $("rcName").textContent = nx[1];
  if (pv) $("rcBar").style.width = Math.min(100, (now - pv[0]) / (nx[0] - pv[0]) * 100).toFixed(1) + "%";
}

        <div><label>Sportsbook</label><select id="lb">${LOG_BOOKS.map(b => `<option ${b === lastBook ? "selected" : ""}>${b}</option>`).join("")}</select></div>
        <div><label>Notes (optional)</label><textarea id="ln" rows="2" placeholder="Why you like it"></textarea></div>
        <div class="err" id="lerr"></div>
        <button class="go" id="lgo">Place bet · ${money(L.book.cash)} available</button>
        ${st.kind === "line" ? '<div class="desc">Grades itself from the final score.</div>' : prop ? '<div class="desc">Grades itself from the box score after the game. A player who does not play is voided.</div>' : '<div class="desc">Custom bets: tap Won, Lost or Push on the bet in Your book when it is decided.</div>'}
      </div>`;
    $("pane").querySelectorAll(".seg:not(#lside) button").forEach(b => b.onclick = () => { keep(); st.kind = b.dataset.k; draw(); });
    const sd = $("lside"); if (sd) sd.querySelectorAll("button").forEach(b => b.onclick = () => { st.side = b.dataset.s; sd.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); });
    const lp = $("lp"); if (lp) lp.addEventListener("input", () => {
      const hit = roster.find(p => p.name.toLowerCase() === lp.value.trim().toLowerCase());
      if (hit && hit.game !== st.game) { st.game = hit.game; $("lg").value = hit.game; }
    });
    const lg = $("lg"); if (lg) lg.onchange = () => { keep(); st.game = lg.value; draw(); };
    $("lgo").onclick = submit;
  };
  const keep = () => { if (st.kind === "line") return; pref = {...pref, player: ($("lp") || {}).value || pref.player, line: ($("ll") || {}).value ?? pref.line, odds: ($("lo") || {}).value || pref.odds, stat: ($("ls") || {}).value || st.stat}; st.stat = pref.stat; };
  const submit = () => {
    const err = m => { $("lerr").textContent = m; };
    const odds = ($("lo").value || "").trim().replace("−", "-"), stake = parseFloat($("lk").value), line = ($("ll") ? $("ll").value : "").trim();
    const book = $("lb").value, notes = $("ln").value.trim();
    if (!/^[+-]?\d{3,4}$/.test(odds)) return err("Odds look like -110 or +150.");
    if (!(stake >= 5)) return err("Minimum bet is $5.");
    store.set("logbook", book);
    const am_ = parseInt(odds.startsWith("+") || odds.startsWith("-") ? odds : "+" + odds, 10);
    const dec = am_ > 0 ? 1 + am_ / 100 : 1 + 100 / Math.abs(am_);
    const bookKey = Object.keys(BOOKN).find(k => BOOKN[k] === book || (book === "Hard Rock" && k === "hardrockbet")) || book;
    let leg, note = notes;
    if (st.kind === "line") {
      leg = {...pref.leg, price: Math.round(dec * 1000) / 1000, book: bookKey, result: null};
    } else if (st.kind === "prop") {
      const who = $("lp").value.trim(), stat = $("ls").value, g = games.find(x => x.espn_id === $("lg").value);
      if (!who) return err("Pick a player.");
      if (line === "" || isNaN(+line)) return err("Enter the line, like 7.5.");
      const pl_ = Object.values(D.players.players || {}).find(p => normName(p.name) === normName(who));
      leg = {sport: "basketball_nba", espn_id: g.espn_id, commence: g.start, home: g.home_name || g.home, away: g.away_name || g.away,
             market: ODDS_KEY[stat], outcome: who + " " + st.side, side: st.side, player: pl_ ? pl_.name : who, player_id: pl_ ? pl_.pid : null,
             stat, point: +line, price: Math.round(dec * 1000) / 1000, book: bookKey, result: null};
      if (new Date(g.start) <= Date.now()) note = (note + " [Logged after tip-off]").trim();
    } else {
      const d = $("ld").value.trim(); if (!d) return err("Describe the bet.");
      leg = {market: "custom", outcome: d, point: line === "" ? null : +line, price: Math.round(dec * 1000) / 1000, book: bookKey, result: null};
    }
    const r = placeBet([leg], stake, note);
    if (r.err) return err(r.err);
    toast(`Logged ${money(r.bet.stake)} on ${leg.outcome}${leg.point != null && leg.market !== "h2h" ? " " + leg.point : ""}`);
    history.back();
    setTimeout(() => RENDER[store.get("tab", "today")](), 50);
  };
  st.kind = pref.kind || st.kind;
  draw();
  $("sheet").classList.add("on"); document.body.style.overflow = "hidden";
  history.pushState({sheet: 1}, "");
}

function filtered(pc) {
  const p = pc.p; let L = p.logs.slice();
  if (pc.opp) L = L.filter(r => r[1] === p.opp);
  if (pc.loc !== "all") L = L.filter(r => r[2] === (pc.loc === "home" ? 1 : 0));
  Object.entries(pc.mates).forEach(([i, v]) => { if (v) L = L.filter(r => (((r[11] >> i) & 1) === 1) === (v === "with")); });
  const cur = Math.max(...p.logs.map(r => r[12]));
  if (pc.win === "season") L = L.filter(r => r[12] === cur);
  else if (pc.win === "last") L = L.filter(r => r[12] === cur - 1);
  else if (pc.win !== "all") L = L.slice(-parseInt(pc.win.slice(1)));
  return L;
}
function hit(r, pc) { const v = SV[pc.stat](r); return pc.side === "Over" ? v > pc.line : v < pc.line; }
function hr(L, pc) { if (!L.length) return "—"; const h = L.filter(r => hit(r, pc)).length; return `${h}/${L.length}`; }
function hrPct(L, pc) { if (!L.length) return ""; return pl(L.filter(r => hit(r, pc)).length / L.length, 0); }

function barChart(L, pc) {
  if (!L.length) return '<div class="empty">No games match these filters.</div>';
  const xs = L.slice(-30), vals = xs.map(r => SV[pc.stat](r));
  const W = 700, H = 150, B = 22, top = 14;
  const mx = Math.max(pc.line * 1.3, ...vals, 1);
  const bw = (W - 10) / xs.length;
  const y = v => H - B - (v / mx) * (H - B - top);
  const bars = xs.map((r, i) => {
    const v = vals[i], h = hit(r, pc), x = 5 + i * bw;
    const yy = y(v);
    return `<rect x="${x + bw * 0.12}" y="${yy}" width="${bw * 0.76}" height="${Math.max(1.5, H - B - yy)}" rx="3" fill="${h ? "var(--win)" : "var(--loss)"}" opacity="${r[10] ? 1 : 0.7}"/>
      ${bw > 18 ? `<text x="${x + bw / 2}" y="${yy - 3}" font-size="11" text-anchor="middle" fill="#e7ecf5" font-family="JetBrains Mono">${f1(v)}</text>` : ""}
      ${bw > 26 ? `<text x="${x + bw / 2}" y="${H - 8}" font-size="9.5" text-anchor="middle" fill="#8a94ab">${esc(r[1])}</text>` : ""}`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${bars}
    <line x1="0" x2="${W}" y1="${y(pc.line)}" y2="${y(pc.line)}" stroke="#E5C158" stroke-width="1.5" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>
    <text x="${W - 4}" y="${y(pc.line) - 4}" font-size="11" text-anchor="end" fill="#E5C158" font-family="JetBrains Mono">${pc.line}</text></svg>
    <div class="desc">Oldest → newest${xs.length < L.length ? " (last 30 shown)" : ""}. Green = ${pc.side.toLowerCase()} hit. Faded bars = came off the bench.</div>`;
}
function logTable(L, pc, withSeason) {
  if (!L.length) return '<div class="empty">No games.</div>';
  return `<div class="scroll"><table class="tbl"><tr><th>Date</th><th>Opp</th><th>Min</th><th>PTS</th><th>REB</th><th>AST</th><th>3PM</th><th>${STATN[pc.stat]}</th><th>Score</th></tr>

        <td class="${h ? "h" : "m"}"><b>${f1(v)}</b></td><td class="dim">${r[13] > r[14] ? "W" : "L"} ${f1(r[13])}-${f1(r[14])}</td></tr>`; }).join("")}</table></div>`;

function dvpCard(p) {
  const T = (D.dvp && D.dvp.tab && D.dvp.tab[p.opp]) || null;
  const n = (D.dvp && D.dvp.n_teams) || 30;
  const rowsFor = role => ALL_STATS.map(s => {
    const v = T && T[role] ? T[role][s] : (role === p.role ? [p.dvp[s][0], p.dvp[s][1]] : null);
    if (!v) return "";
    const [f, rk] = v, w = Math.min(50, Math.abs(f - 1) * 250);
    return `<tr class="${s === D.pc.stat ? "hl" : ""}"><td class="t">${STATL[s]}</td><td class="${f > 1 ? "h" : "m"}">${pct(f - 1, 0)}</td><td>#${rk}</td>
      <td style="width:38%"><div class="hbar"><span class="c"></span><i style="${f > 1 ? "left:50%" : "right:50%"};width:${w}%;background:${f > 1 ? "var(--win)" : "var(--loss)"}"></i></div></td></tr>`;
  }).join("");
  return `<div class="desc">How ${esc(p.opp)}'s opponents at each position do vs their own norms (rank 1 = gives up the most, of ${n}). His role: <b style="color:var(--text)">${esc(p.pos)}</b>.</div>

}

// ---- sportsbook line history (the agent saves every line it prices; loaded only when a card opens) ----
async function getLines() {
  if (!D.lines) {
    const db = await get("lines.json", {entries: {}});
    const by = {};
    Object.values(db.entries || {}).forEach(e => (by[e.pid + "|" + e.stat] = by[e.pid + "|" + e.stat] || []).push(e));
    Object.values(by).forEach(a => a.sort((x, y) => y.date.localeCompare(x.date)));
    D.lines = {by, n: Object.keys(db.entries || {}).length};
  }
  return D.lines;
}
// the line the books had on a player in a game near this date (comp rows use UTC dates, lines use the ET slate date)
function bookLine(pid, stat, date, opp) {
  const a = (D.lines && D.lines.by[pid + "|" + stat]) || [];
  const t = new Date(date + "T12:00:00Z").getTime();
  return a.find(e => (!opp || e.opp === opp) && Math.abs(new Date(e.date + "T12:00:00Z") - t) <= 36 * 3600e3) || null;
}

    const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; };

  const Ls = [-2, -1, 0, 1, 2].map(d => line + d).filter(L => L > 0);
  return `<div class="desc">What the model thinks each line is worth. Bet an alt line only when your book pays better than the fair price shown.</div>
    <div class="scroll"><table class="tbl"><tr><th>Line</th><th>Over %</th><th>Fair over</th><th>Under %</th><th>Fair under</th></tr>
    ${Ls.map(L => { const p = pOver(L); return `<tr class="${L === line ? "hl" : ""}"><td class="t">${f1(L)}</td><td>${Math.round(p * 100)}%</td><td>${fair(p)}</td><td>${Math.round((1 - p) * 100)}%</td><td>${fair(1 - p)}</td></tr>`; }).join("")}</table></div>`;
}
function compTable(p, s, pc) {

  const hit = v => v == null || line == null ? null : (side === "Over" ? v > line : v < line);
  let tot = 0, hits = 0;

    gs.forEach(x => { if (x.v != null && line != null) { tot++; if (hit(x.v)) hits++; } });
    const avgS = n ? gs.reduce((t, x) => t + (x.v || 0), 0) / n : null;

      ${hasG && line != null ? `<td>${f1(avgS)}</td><td class="${avgS != null && hit(avgS) ? "h" : "m"}">${avgS == null ? "—" : (avgS - line > 0 ? "+" : "") + f1(avgS - line)}</td><td>${ov}/${n}</td>` : ""}</tr>`;

      <td class="${g[2][s][0] >= g[2][s][1] ? "h" : "m"}">${g[2][s][1] ? pct(g[2][s][0] / g[2][s][1] - 1, 0) : "—"}</td>${line != null ? `<td>${f1(v)}</td><td class="${hit(v) ? "h" : "m"}">${v == null ? "—" : (v - line > 0 ? "+" : "") + f1(v - line)}</td><td>${v != null && v > line ? "O" : "U"}</td>` : ""}</tr>`).join("");

    <div class="scroll"><table class="tbl" id="comptbl"><tr><th>Player</th><th>Min</th><th>Exp</th><th>${STATN[s]}</th><th>Diff</th>${extra ? `<th>@ his min</th><th>vs ${f1(line)}</th><th>Over</th>` : ""}</tr>${rows}</table></div>`;
}
function shotZone(x, y, three) {

}

  const Z = {};

    <div class="desc" style="margin-top:6px">From ESPN play-by-play shot locations. Green = make, red × = miss.</div>`;
}

async function fillClv() {
  if (!D.closes) D.closes = await get("closes.json", {});
  await getLines();
  const el = $("b-b-clv"), meta = $("m-b-clv"); if (!el) return;
  const pt = p => p == null ? "" : String(+p);
  const rows = [];

    if (b.legs.length !== 1 || b.status === "cancelled") continue;
    const l = b.legs[0];
    let close = null, ptsVal = null, src = "";
    if (l.stat && l.player_id) {
      const d = new Intl.DateTimeFormat("en-CA", {timeZone: "America/New_York"}).format(new Date(l.commence));
      let e = ((D.lines.by[l.player_id + "|" + l.stat]) || []).find(x => x.date === d);
      if (!e) {                                   // DraftKings' own closing line from ESPN's feed
        D.dkDays = D.dkDays || {};
        if (!(d in D.dkDays)) D.dkDays[d] = await get(`dk/${d}.json`, {props: {}});
        const r = (D.dkDays[d].props || {})[l.player_id + "|" + l.stat];
        if (r && r.c && r.c[1] && r.c[2]) { const io = 1 / r.c[1], iu = 1 / r.c[2]; e = {line: r.c[0], p_over: io / (io + iu)}; }
      }
      if (e) {
        if (e.line === l.point && e.p_over != null) close = l.side === "Over" ? e.p_over : 1 - e.p_over;
        else ptsVal = l.side === "Over" ? e.line - l.point : l.point - e.line;
        src = "closed " + f1(e.line);
      }
    } else if (l.event_id && D.closes[l.event_id]) {
      const c = D.closes[l.event_id].o[`${l.market}|${l.outcome}|${pt(l.point)}`];
      if (c != null) close = c;
    }
    if (close == null && ptsVal == null) continue;
    const clv = close != null ? l.price * close - 1 : null;
    const pre = new Date(l.commence) > Date.now();
    rows.push({b, l, close, clv, ptsVal, src, pre});
  }
  const withC = rows.filter(r => r.clv != null);
  const beat = rows.filter(r => (r.clv != null ? r.clv > 0 : r.ptsVal > 0)).length;
  const avg = withC.length ? withC.reduce((t, r) => t + r.clv, 0) / withC.length : null;
  meta.textContent = rows.length ? `beat ${beat}/${rows.length}` : "";
  el.innerHTML = rows.length ? `<div class="card" style="padding:9px 12px;margin-bottom:8px">You beat the closing line on <b>${beat} of ${rows.length}</b> bets${avg != null ? ` · average CLV <b class="${cls(avg)}">${pct(avg)}</b>` : ""}. Consistently beating the close is the earliest real sign of an edge, long before wins and losses mean much.</div>` +
    rows.slice(0, 40).map(r => `<div class="bet"><div class="what">${esc(r.l.outcome)}${r.l.point != null && r.l.market !== "h2h" && !r.l.stat ? " " + r.l.point : r.l.stat ? " " + r.l.point + " " + STATN[r.l.stat] : ""}</div>
      <div class="amt ${r.clv != null ? cls(r.clv) : cls(r.ptsVal)}">${r.clv != null ? pct(r.clv) : (r.ptsVal > 0 ? "+" : "") + f1(r.ptsVal) + " pts"}</div>
      <div class="sub">you ${am(r.l.price)}${r.close != null ? " · close fair " + am(1 / r.close) : ""}${r.src ? " · " + esc(r.src) : ""}${r.pre ? " · still moving (game not started)" : ""}</div></div>`).join("")
    : '<div class="empty">Shows up once you have bets on lines the agent tracks: board game lines it scans, or props it priced that day.</div>';

// Minutes: projected (what the sim plays) vs actual, from the nightly grading. Most prop misses are minutes misses.
function minDays(n) {
  const daily = (D.simlog && D.simlog.daily) || {}, days = Object.keys(daily).sort().slice(-n);
  const t = {n: 0, abs: 0, in4: 0, dnp: 0, st: [0, 0, 0], bn: [0, 0, 0]};
  days.forEach(d => { const x = daily[d];
    if (x.min_acc) { t.n += x.min_acc[0]; t.abs += x.min_acc[1]; t.in4 += x.min_acc[2]; }
    if (x.min_dnp) t.dnp += x.min_dnp[0];
    ["st", "bn"].forEach(k => { const v = x[k === "st" ? "min_starter" : "min_bench"]; if (v) { t[k][0] += v[0]; t[k][1] += v[1]; t[k][2] += v[2]; } }); });
  return t;
}
function minMeta() { const t = minDays(7); return t.n ? `${f1(t.abs / t.n)} min avg miss · 7 days` : ""; }

// ===================================================== live games (free ESPN feed, fetched by your browser)
const ESPN = {
  basketball_nba:{p:"basketball/nba", per:4, len:12}, basketball_wnba:{p:"basketball/wnba", per:4, len:10},
  basketball_ncaab:{p:"basketball/mens-college-basketball", per:2, len:20, q:"&groups=50"},
  americanfootball_nfl:{p:"football/nfl", per:4, len:15}, americanfootball_ncaaf:{p:"football/college-football", per:4, len:15, q:"&groups=80"},
  icehockey_nhl:{p:"hockey/nhl", per:3, len:20}, baseball_mlb:{p:"baseball/mlb", inn:9},
  soccer_epl:{p:"soccer/eng.1", soc:1}, soccer_usa_mls:{p:"soccer/usa.1", soc:1}, soccer_uefa_champs_league:{p:"soccer/uefa.champions", soc:1},
  mma_mixed_martial_arts:{p:"mma/ufc", none:1}
};
const ESPN_BASE = "https://site.api.espn.com/apis/site/v2/sports/";
const _cache = {};
async function cached(key, ttl, fn) {
  const c = _cache[key];
  if (c && Date.now() - c.t < ttl) return c.v;
  try { const v = await fn(); _cache[key] = {t: Date.now(), v}; return v; } catch (e) { return c ? c.v : null; }
}
const etDate = ts => new Intl.DateTimeFormat("en-CA", {timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit"}).format(new Date(ts)).replaceAll("-", "");
const nk = s => String(s || "").toLowerCase().replace(/^la /, "los angeles ").replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();
function teamOf(c) { const t = c.team || {}; return {name: t.displayName, nick: t.name, loc: t.location, abbr: t.abbreviation, score: Number(c.score ?? 0)}; }
const dispSec = d => { const m = /^(\d+):(\d+)(?:\.\d+)?$/.exec(d || ""); return m ? +m[1] * 60 + +m[2] : (/^\d+(\.\d+)?$/.test(d || "") ? +d : null); };
function normGame(e) {
  const st = e.status || {}, ty = st.type || {};
  const comp = (e.competitions && e.competitions[0]) || e, cs = comp.competitors || [];
  const h = cs.find(c => c.homeAway === "home"), a = cs.find(c => c.homeAway === "away");
  if (!h || !a) return null;
  return {id: e.id, state: ty.state || "pre", detail: ty.shortDetail || ty.detail || "", period: st.period || 0, clock: st.clock ?? dispSec(st.displayClock),
          disp: st.displayClock || "", home: teamOf(h), away: teamOf(a), start: e.date};
}
const sameTeam = (odds, t) => {
  const o = nk(odds), full = nk(t.name);
  if (!o || !t.name) return false;
  if (o === full) return true;
  const nick = nk(t.nick), loc = nk(t.loc);
  return !!nick && o.endsWith(nick) && (!loc || o.startsWith(loc) || nk(t.loc) === "la");
};
async function scoreboard(sport, date) {
  const cfg = ESPN[sport]; if (!cfg) return null;
  return cached("sb|" + sport + date, 25000, async () => {
    const r = await fetch(ESPN_BASE + cfg.p + "/scoreboard?dates=" + date + "&limit=400" + (cfg.q || ""));
    const d = await r.json(); return (d.events || []).map(normGame).filter(Boolean);
  });
}
async function summary(sport, id) {
  const cfg = ESPN[sport]; if (!cfg) return null;
  return cached("sm|" + id, 25000, async () => {
    const r = await fetch(ESPN_BASE + cfg.p + "/summary?event=" + id); const d = await r.json();
    const comp = d.header.competitions[0];
    const g = normGame({id, date: comp.date, status: comp.status, competitions: [comp]});
    const players = {};
    for (const t of (d.boxscore?.players || [])) for (const grp of (t.statistics || [])) {
      const L = grp.labels || [];
      for (const a of (grp.athletes || [])) { const row = {_n: a.athlete.displayName}; L.forEach((k, i) => row[k] = a.stats?.[i]); if (a.didNotPlay) row.MIN = "0"; players[a.athlete.id] = row; }
    }
    const ls = {};
    for (const c of (comp.competitors || [])) ls[c.homeAway] = (c.linescores || []).map(x => +(x.displayValue ?? x.value ?? 0));
    return {g, players, ls};
  });
}
const clockStr = sec => { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); };
function progress(sport, g) {
  const cfg = ESPN[sport] || {};
  if (g.state === "pre") return {frac: 0, left: ""};
  if (g.state === "post") return {frac: 1, left: "Final"};
  if (cfg.per) {
    const total = cfg.per * cfg.len * 60, p = g.period, c = g.clock ?? 0;
    if (p > cfg.per) return {frac: 1, left: "Overtime · " + clockStr(c) + " in period"};
    const el = (p - 1) * cfg.len * 60 + (cfg.len * 60 - c);
    return {frac: Math.min(1, el / total), left: clockStr(total - el) + " left in regulation"};
  }
  if (cfg.inn) {
    const p = g.period || 1, d = g.detail.toLowerCase();
    const off = d.startsWith("top") ? 0.25 : d.startsWith("mid") ? 0.5 : d.startsWith("bot") ? 0.75 : d.startsWith("end") ? 1 : 0.5;
    const el = p - 1 + off;
    return {frac: Math.min(0.99, el / cfg.inn), left: el >= cfg.inn ? "Extra innings" : "≈ " + (cfg.inn - el).toFixed(1).replace(".0", "") + " innings left"};
  }
  if (cfg.soc) { const m = parseInt(g.disp) || 0; return {frac: Math.min(1, m / 90), left: m >= 90 ? "Stoppage time" : "≈ " + (90 - m) + " min left"}; }
  return {frac: 0.5, left: ""};
}
function evalLeg(l, g) {
  const mine = l.outcome === l.home ? g.home : l.outcome === l.away ? g.away : null;
  const other = mine === g.home ? g.away : g.home;
  const fin = g.state === "post", F = x => (Math.abs(x) % 1 ? x.toFixed(1) : x.toFixed(0));
  if (l.market === "h2h") {
    if (!mine) return {tone: g.home.score === g.away.score ? "win" : "lose", txt: g.home.score === g.away.score ? "Level — the draw is live" : "Draw needs level scores"};
    const d = mine.score - other.score;
    return {tone: d > 0 ? "win" : d < 0 ? "lose" : "even", txt: d > 0 ? (fin ? "Won" : "Winning") + " by " + F(d) : d < 0 ? (fin ? "Lost" : "Trailing") + " by " + F(-d) : "Tied"};
  }
  if (l.market === "spreads" && mine) {
    const m = mine.score - other.score + (l.point || 0);
    return {tone: m > 0 ? "win" : m < 0 ? "lose" : "even", txt: m > 0 ? (fin ? "Covered" : "Covering") + " by " + F(m) : m < 0 ? (fin ? "Missed" : "Not covering") + " by " + F(-m) : "On the number"};
  }
  if (l.market === "totals" || l.market === "team_totals") {
    const tot = l.market === "team_totals" ? (l.team === l.home ? g.home.score : g.away.score) : g.home.score + g.away.score;
    const over = String(l.outcome).toLowerCase() === "over", gap = tot - l.point, ok = over ? gap > 0 : gap < 0, need = Math.floor(l.point - tot) + 1;
    return {tone: gap === 0 ? "even" : ok ? "win" : "lose",
      txt: (l.market === "team_totals" ? "Team " : "Total ") + F(tot) + " · " + (over ? (gap > 0 ? "over by " + F(gap) : "needs " + need + " more") : (gap < 0 ? F(-gap) + " of room" : "busted by " + F(gap)))};
  }
  return null;
}
function statVal(row, stat) {
  if (!row) return null;
  const n = k => Number(row[k]) || 0;
  switch (stat) {
    case "pts": return n("PTS"); case "reb": return n("REB"); case "ast": return n("AST");
    case "tpm": return Number(String(row["3PT"] || "0-0").split("-")[0]) || 0;
    case "pra": return n("PTS") + n("REB") + n("AST"); case "ra": return n("REB") + n("AST");
  }
  return null;
}
function untilStr(ts) {
  const m = Math.round((new Date(ts) - Date.now()) / 60000);
  if (m <= 0) return "any minute";
  return m < 60 ? m + "m" : m < 1440 ? Math.floor(m / 60) + "h " + (m % 60) + "m" : Math.floor(m / 1440) + "d " + Math.floor((m % 1440) / 60) + "h";
}
async function liveFor(b) {
  const legs = b.legs.filter(l => l.sport && l.commence);
  if (!legs.length) return "";
  const parts = [];
  for (const l of legs) {
    const isProp = String(l.market).startsWith("player_") || l.stat;
    const startMs = new Date(l.commence).getTime(), now = Date.now();
    const label = legs.length > 1 ? `<div style="font-size:12px;margin-bottom:3px">${legText(l)}</div>` : "";
    if (now < startMs - 15 * 60000) {
      parts.push(`<div class="leg">${label}<div class="t"><span class="st2">Starts in <b class="num" style="color:var(--text)">${untilStr(l.commence)}</b> · ${when(l.commence)}</span></div></div>`);
      continue;
    }
    let g = null, players = null;
    if (isProp && l.espn_id) { const sm = await summary(l.sport, l.espn_id); if (sm) { g = sm.g; players = sm.players; } }
    else { const sb = await scoreboard(l.sport, etDate(l.commence)); g = (sb || []).find(x => sameTeam(l.home, x.home) && sameTeam(l.away, x.away)) || null; }
    if (!g) { parts.push(`<div class="leg">${label}<div class="t"><span class="st2">${now < startMs ? "Starting soon" : "Started " + ago(l.commence)} · live feed not available for this game</span></div></div>`); continue; }
    const pr = progress(l.sport, g);
    const sc = `${esc(g.away.abbr || g.away.name)} <b>${g.away.score}</b> – ${esc(g.home.abbr || g.home.name)} <b>${g.home.score}</b>`;
    const badge = g.state === "in" ? '<span class="pill live">LIVE</span>' : g.state === "post" ? '<span class="pill fin">FINAL</span>' : '<span class="pill">SOON</span>';
    let ev = null, statBar = "";
    if (isProp && players) {
      const row = players[l.player_id], v = statVal(row, l.stat), over = String(l.side).toLowerCase() === "over";
      if (v == null) ev = {tone: "even", txt: g.state === "pre" ? "Waiting for tip-off" : "Not in the box score yet (hasn't played)"};
      else {
        const cashed = over && v > l.point, busted = !over && v > l.point, ok = over ? v > l.point : v < l.point;
        const tone = cashed ? "win" : busted ? "lose" : (g.state === "post" ? (ok ? "win" : "lose") : "even");
        const tail = over ? (cashed ? "cleared" : "needs " + (Math.floor(l.point - v) + 1) + " more") : (busted ? "busted" : (l.point - v).toFixed(1).replace(".0", "") + " of room");
        ev = {tone, txt: `${v} ${STATN[l.stat] || l.stat} · ${over ? "O" : "U"} ${l.point} · ${tail}`};
        const mx = Math.max(l.point * 1.25, v, 1);
        statBar = `<div class="sbar ${tone}"><i style="width:${Math.min(100, v / mx * 100)}%"></i><u style="left:${l.point / mx * 100}%"></u></div>`;
      }
    } else if (!isProp) ev = evalLeg(l, g);
    parts.push(`<div class="leg">${label}<div class="t"><span>${badge} <span class="st2">${esc(g.state === "pre" ? when(l.commence) : g.detail)}</span></span><span class="sc">${sc}</span></div>` +
      `<div class="pbar ${ev ? ev.tone : ""}"><i style="width:${Math.max(2, pr.frac * 100)}%"></i></div>${statBar}` +
      `<div class="s"><b class="${ev ? "tone-" + ev.tone : ""}">${ev ? esc(ev.txt) : ""}</b><span>${esc(pr.left)}</span></div></div>`);
  }
  return parts.length ? `<div class="lv">${parts.join("")}</div>` : "";
}
let _liveBusy = false;
