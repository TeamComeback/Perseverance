<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070D">
<title>Perseverance City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04060C;--bg2:#0A0F1C;--panel:#0D1322;--panel2:#121A2D;--line:#1C2640;--line2:#27324F;--text:#E6EBF2;--dim:#8C98AA;--dim2:#5F6B82;
  --q:#7FE3FF;--v:#A78BFA;--gold:#E5C158;--win:#4ADE80;--loss:#F87171;--amber:#FBBF24;
  --mono:"JetBrains Mono",ui-monospace,monospace;--disp:"Space Grotesk",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{background:radial-gradient(900px 500px at 50% -120px,#7FE3FF12,transparent 70%),radial-gradient(700px 420px at 110% 30%,#A78BFA10,transparent 70%),var(--bg);min-height:100vh}
a{color:var(--q)}
.wrap{max-width:860px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 12px 140px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px 8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.atom{width:30px;height:30px;flex:none}
.brand h1{font:700 15px/1.1 var(--disp);letter-spacing:.14em;margin:0;white-space:nowrap}
.brand small{display:block;font:500 10.5px/1.3 var(--mono);color:var(--q);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.back{font:600 12px var(--disp);color:var(--dim);text-decoration:none;border:1px solid var(--line2);border-radius:999px;padding:6px 11px;white-space:nowrap}
.ribbon{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px;margin:0 -12px;padding-left:12px;padding-right:12px}
.ribbon::-webkit-scrollbar{display:none}
.stat{flex:none;border:1px solid var(--line);background:linear-gradient(180deg,#ffffff06,#ffffff00);border-radius:10px;padding:6px 10px}
.stat b{display:block;font:700 15px/1.1 var(--mono);color:var(--text)}
.stat span{font:500 10px/1.2 var(--disp);color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.seg{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:8px}
.seg button{flex:1;appearance:none;border:0;background:none;color:var(--dim);font:600 12.5px var(--disp);padding:8px 4px;border-radius:9px;letter-spacing:.02em}
.seg button.on{background:linear-gradient(180deg,#7FE3FF22,#A78BFA18);color:var(--text);box-shadow:inset 0 0 0 1px #7FE3FF40}
.seg button:disabled{opacity:.38}
.seg button small{display:block;font:500 9px var(--mono);letter-spacing:.08em;opacity:.8}
.clock{display:flex;align-items:center;gap:8px;font:500 12px var(--mono);color:var(--dim);padding:2px 2px 8px;min-height:26px}
.clock .pulse{width:7px;height:7px;border-radius:50%;background:var(--q);box-shadow:0 0 10px var(--q);animation:pl 2s infinite;flex:none}
.clock b{color:var(--text);font-weight:700}
@keyframes pl{50%{opacity:.35}}
.stage{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:
  radial-gradient(120% 70% at 50% 0,#0E1730 0,#060A14 60%,#04060C 100%)}
.stage svg{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stage .hint{position:absolute;left:10px;bottom:8px;font:500 10.5px var(--mono);color:var(--dim2);pointer-events:none;z-index:2}
/* 2D / 3D switch and the 3D city */
.mode{position:absolute;right:8px;bottom:8px;z-index:3;display:flex;gap:2px;padding:3px;border:1px solid var(--line2);border-radius:999px;background:#0A0F1CCC;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.mode button{appearance:none;border:0;background:none;color:var(--dim);font:700 12px var(--disp);letter-spacing:.06em;padding:7px 14px;border-radius:999px;min-width:44px}
.mode button.on{background:linear-gradient(180deg,#7FE3FF33,#A78BFA26);color:#fff;box-shadow:inset 0 0 0 1px #7FE3FF66}
.mode button:disabled{opacity:.35}
.map3d{position:relative;width:100%;aspect-ratio:400/610;animation:fadein .7s ease both}
.map3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;outline:none}
.c3ctl{position:absolute;right:8px;bottom:58px;z-index:3;display:grid;grid-template-columns:40px 40px;gap:6px}
.c3ctl button{appearance:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line2);background:#0A0F1CCC;color:var(--text);font:600 18px/1 var(--disp);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.c3ctl button:active{background:#7FE3FF33}
@media (min-width:760px){.map3d{aspect-ratio:16/10}}
/* a run on show: the desk that is working, the Spire while a run is in progress */
.bld.act{animation:actp 1.1s ease-in-out 2}
.bld.busy{animation:actp .9s ease-in-out infinite}
@keyframes actp{50%{filter:brightness(1.9) drop-shadow(0 0 5px #7FE3FF)}}
.room.livepulse{animation:roomp 1s ease-in-out 3;box-shadow:0 0 0 1.5px var(--c),0 0 26px color-mix(in srgb,var(--c) 45%,transparent)}
@keyframes roomp{50%{box-shadow:0 0 0 2px #fff,0 0 34px var(--c)}}
.rp{appearance:none;margin-left:auto;flex:none;border:1px solid var(--line2);background:var(--panel2);color:var(--q);font:700 10.5px var(--mono);letter-spacing:.06em;border-radius:999px;padding:5px 10px;white-space:nowrap}
.zoomout{position:absolute;right:10px;top:10px;display:none;appearance:none;border:1px solid var(--line2);background:#0A0F1CCC;color:var(--text);font:600 12px var(--disp);border-radius:999px;padding:6px 12px;backdrop-filter:blur(6px)}
.zoomout.show{display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font:500 11px var(--disp);color:var(--dim);padding:10px 4px 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.ticker{margin-top:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:8px 12px;font-size:12.5px;color:var(--dim)}
.ticker b{color:var(--gold);font:700 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-right:6px}
.ticker div+div{margin-top:4px}
/* svg pieces */
.bld{cursor:pointer}
.bld .lbl{font:700 9.5px var(--disp);letter-spacing:.06em;fill:#fff;paint-order:stroke;stroke:#04060C;stroke-width:3px;text-transform:uppercase}
.bld .sub{font:500 6.6px var(--mono);letter-spacing:.08em;fill:#B9C3D6;paint-order:stroke;stroke:#04060C;stroke-width:2.4px}
.dim .bld{opacity:.28;transition:opacity .4s}
.dim .bld.hot{opacity:1}
.dim .route,.dim .beam{opacity:.08}
.route{transition:opacity .4s}
.win.lit{animation:flick 6s infinite}
@keyframes flick{0%,96%,100%{opacity:1}97%{opacity:.6}}
.win.prob{animation:pl 1.6s infinite}
.portal circle.ring{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.orb{filter:url(#glow)}
/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.pane{pointer-events:auto;width:100%;max-width:860px;max-height:72vh;overflow-y:auto;background:linear-gradient(180deg,#0D1322F2,#080C17F7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line2);border-bottom:0;border-radius:20px 20px 0 0;padding:0 14px max(16px,env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 60px #000A}
.pane.open{transform:none}
.pane.half{max-height:46vh}
.ph{position:sticky;top:0;z-index:2;background:#0C1220;margin:0 -14px 8px;padding:8px 14px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.ph .grab{position:absolute;left:50%;top:5px;width:38px;height:4px;border-radius:9px;background:var(--line2);transform:translateX(-50%)}
.ph h2{margin:10px 0 0;font:700 17px/1.2 var(--disp);flex:1;min-width:0}
.ph h2 small{display:block;font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.ib{appearance:none;border:1px solid var(--line2);background:var(--panel2);color:var(--text);width:34px;height:34px;border-radius:50%;font:600 15px var(--disp);flex:none;margin-top:10px}
.about{color:var(--dim);margin:2px 0 10px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 12px}
.kv div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 8px}
.kv b{display:block;font:700 14px var(--mono)}
.kv span{font:500 9.5px var(--disp);color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
h3{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
.desk{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);background:var(--panel);border-radius:12px;margin-bottom:6px;cursor:pointer}
.desk .st{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}
.desk b{font:600 13.5px var(--disp)}
.desk p{margin:2px 0 0;color:var(--dim);font-size:12.5px}
.desk .meta{margin-left:auto;text-align:right;font:500 11px var(--mono);color:var(--dim);white-space:nowrap;flex:none}
.desk .meta b{display:block;font:700 12px var(--mono);color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:999px;padding:3px 9px;font:500 11.5px var(--disp);color:var(--text);background:var(--panel2);margin:0 4px 5px 0;cursor:pointer}
.chip i{width:6px;height:6px;border-radius:50%;display:inline-block}
.chip.ok i{background:var(--win)}.chip.warn i{background:var(--amber)}.chip.old i{background:var(--dim2)}
.tag{display:inline-block;font:700 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid currentColor;margin-left:6px;vertical-align:1px}
.code{font:500 12px var(--mono);display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:5px;background:var(--panel);text-decoration:none;color:var(--text)}
.code span{color:var(--dim)}
.note{border-left:2px solid var(--amber);padding:6px 10px;background:#FBBF240D;border-radius:0 8px 8px 0;font-size:12.5px;color:#E8D9A8;margin:8px 0}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.row:last-child{border-bottom:0}
.row span{color:var(--dim)}
.row b{font:600 12.5px var(--mono);text-align:right}
.good{color:var(--win)}.bad{color:var(--loss)}.warnc{color:var(--amber)}
.law{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.law b{font:700 12px var(--mono);color:var(--gold)}
/* trace */
.filters{display:flex;gap:5px;flex-wrap:wrap;margin:2px 0 8px}
.filters button{appearance:none;border:1px solid var(--line2);background:var(--panel2);color:var(--dim);font:600 12px var(--disp);padding:6px 11px;border-radius:999px}
.filters button.on{color:var(--text);border-color:#7FE3FF80;background:#7FE3FF1A}
.search{width:100%;appearance:none;background:var(--panel);border:1px solid var(--line2);border-radius:10px;color:var(--text);font:500 14px Inter;padding:9px 11px;margin-bottom:8px;outline:none}
.bet{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:6px;cursor:pointer}
.bet .q{width:22px;height:22px;flex:none;border-radius:50%;position:relative}
.bet .q.open{background:conic-gradient(var(--win),var(--q),var(--loss),var(--v),var(--win));animation:spin 4s linear infinite}
.bet .q.won{background:radial-gradient(circle,#BBF7D0,var(--win) 60%);box-shadow:0 0 10px #4ADE8066}
.bet .q.lost{background:radial-gradient(circle,#FECACA,var(--loss) 60%);box-shadow:0 0 10px #F8717166}
.bet .q.push{background:var(--dim2)}
.bet b{font:600 13.5px var(--disp);display:block}
.bet small{color:var(--dim);font:500 11px var(--mono)}
.bet .d{margin-left:auto;font:500 11px var(--mono);color:var(--dim);white-space:nowrap}
.ctl{display:flex;gap:6px;align-items:center;margin:4px 0 10px}
.ctl button{appearance:none;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font:600 13px var(--disp);border-radius:10px;padding:8px 12px}
.ctl .prog{flex:1;height:4px;border-radius:9px;background:var(--line);overflow:hidden}
.ctl .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--q),var(--v));width:0;transition:width .3s}
.ctl span{font:600 11px var(--mono);color:var(--dim);min-width:44px;text-align:right}
.steps{position:relative;padding-left:18px}
.steps:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1px;background:linear-gradient(var(--q),var(--v))}
.step{position:relative;padding:7px 10px;border:1px solid transparent;border-radius:10px;margin-bottom:3px;cursor:pointer;opacity:.5;transition:opacity .25s,background .25s}
.step:before{content:"";position:absolute;left:-16px;top:13px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--c,var(--q))}
.step.seen{opacity:.85}
.step.cur{opacity:1;background:var(--panel2);border-color:var(--line2)}
.step.cur:before{background:var(--c,var(--q));box-shadow:0 0 10px var(--c,var(--q))}
.step .who{font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--c,var(--q))}
.step .who em{font-style:normal;color:var(--dim2);margin-left:6px}
.step p{margin:2px 0 0;font-size:13px}
.k{font:700 9px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:999px;margin-left:6px}
.k.for{color:var(--win);border:1px solid #4ADE8066}.k.against{color:var(--loss);border:1px solid #F8717166}
.verdict{margin:10px 0 2px;padding:10px 12px;border-radius:12px;font:600 14px var(--disp);display:flex;align-items:center;gap:10px}
.verdict.won{background:#4ADE8014;border:1px solid #4ADE8055;color:#BBF7D0}
.verdict.lost{background:#F8717114;border:1px solid #F8717155;color:#FECACA}
.verdict.open{background:#7FE3FF10;border:1px solid #7FE3FF44;color:#CFF5FF}
.verdict.push{background:#ffffff08;border:1px solid var(--line2)}
.empty{color:var(--dim);padding:20px 4px;text-align:center}
.loading{padding:60px 0;text-align:center;font:500 12px var(--mono);color:var(--dim)}

/* entrance: the city rises, the routes draw themselves */
#city.enter .bld{animation:rise .95s cubic-bezier(.16,.84,.24,1) both;animation-delay:calc(var(--i,4)*85ms + 120ms)}
#city.enter #portals,#city.enter #beams{animation:fadein .9s ease both}
#city.enter #routes path{stroke-dasharray:700;stroke-dashoffset:700;animation:drawp 1.5s ease-out 1s forwards}
#city.enter #routes circle{animation:fadein .6s ease 2s both}
@keyframes rise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes drawp{to{stroke-dashoffset:0}}
/* workers behind the glass */
.wkr.hot{animation:wbob 1.1s ease-in-out infinite}
.wkr.hot .mon{animation:flk .7s steps(2) infinite}
.wkr.lit{animation:wbob 2.6s ease-in-out infinite}
.wkr.dark,.wkr.standby{opacity:.55}
@keyframes wbob{50%{transform:translateY(-.55px)}}
@keyframes flk{50%{opacity:.45}}
/* the "now" strip */
#now{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-left:3px solid var(--c,var(--q));border-radius:12px;background:linear-gradient(90deg,color-mix(in srgb,var(--c,#7FE3FF) 9%,transparent),transparent 60%),var(--panel);
  padding:8px 10px;margin:0 0 8px;min-height:50px;cursor:pointer;transition:opacity .22s,transform .22s}
#now.swap{opacity:0;transform:translateY(4px)}
#now>i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--q));box-shadow:0 0 10px var(--c,var(--q));animation:pl 1.4s infinite;flex:none}
#now div{min-width:0;flex:1}
#now b{font:700 12.5px var(--disp);color:var(--c,var(--q))}
#now em{font:500 10px var(--mono);font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);margin-left:7px}
#now span{display:block;font-size:13px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#now u{text-decoration:none;color:var(--dim);font:600 18px var(--disp)}
#now{position:relative;overflow:hidden}
#now.run{border-color:color-mix(in srgb,var(--c,#7FE3FF) 55%,transparent);box-shadow:0 0 22px color-mix(in srgb,var(--c,#7FE3FF) 18%,transparent)}
#now.run em{color:var(--c,var(--q));margin-left:0;display:block}
#now.run b{color:#fff}
#now .rbar{position:absolute;left:0;right:0;bottom:0;height:2px;margin:0;background:var(--line)}
#now .rbar b{display:block;height:100%;background:linear-gradient(90deg,var(--q),var(--v));transition:width .5s}
#now .rbar.live b{width:35%;animation:slide 1.3s linear infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(290%)}}
/* inside a building */
.stage.in{background:radial-gradient(120% 40% at 50% 0,#0E1730 0,#060A14 70%)}
.stage.in .zoomout{display:none}
#inroom{padding:8px}
.inbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.inbar .it{flex:1;min-width:0}
.inbar .it b{display:block;font:700 18px/1.15 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inbar .it small{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.ib2{appearance:none;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font:600 13px var(--disp);border-radius:999px;padding:8px 13px;white-space:nowrap}
.ib2.sq{width:36px;height:36px;padding:0;font-size:17px}
.tower{position:relative;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:16px;padding:10px;
  background:linear-gradient(color-mix(in srgb,var(--c) 7%,transparent),transparent 180px),repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 28px),#070B15;
  box-shadow:inset 0 0 40px color-mix(in srgb,var(--c) 9%,transparent),0 0 30px color-mix(in srgb,var(--c) 10%,transparent)}
.roof{position:relative;padding:4px 4px 10px 22px;border-bottom:1px dashed color-mix(in srgb,var(--c) 35%,transparent);margin-bottom:10px}
.roof .ant{position:absolute;left:6px;top:2px;bottom:12px;width:2px;background:linear-gradient(var(--c),transparent)}
.roof .ant:before{content:"";position:absolute;left:-3px;top:-2px;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c);animation:pl 1.8s infinite}
.roof p{margin:0 0 6px;font-size:13px;color:var(--dim)}
.rk{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font:500 11.5px var(--mono);color:var(--dim)}
.rk b{color:var(--text)}
.lnk{appearance:none;background:none;border:0;color:var(--c);font:600 12px var(--disp);padding:2px 0;margin-left:auto;text-decoration:underline;text-underline-offset:3px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:0 0 10px;font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim2)}
.flow span{width:100%}
.flow.out{margin:10px 0}
.goc{appearance:none;display:inline-flex;align-items:center;gap:6px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent);color:var(--text);font:600 11.5px var(--disp);border-radius:999px;padding:5px 10px;text-transform:none;letter-spacing:0}
.goc i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.goc em{font:700 10px var(--mono);font-style:normal;color:var(--c)}
.floors{display:grid;grid-template-columns:1fr;gap:8px}
.room{position:relative;border:1px solid var(--line);border-top:2px solid color-mix(in srgb,var(--c) 70%,transparent);border-radius:12px;padding:8px 9px 9px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 8%,transparent),transparent 46%),#0A0F1D;overflow:hidden}
.room:not(.on){border-top-color:var(--line2);background:#090D18}
.room.pick{box-shadow:0 0 0 1.5px var(--c),0 0 26px color-mix(in srgb,var(--c) 40%,transparent)}
#inroom.go .room{animation:floorin .6s cubic-bezier(.16,.84,.24,1) both;animation-delay:calc(var(--i)*80ms + 80ms)}
#inroom.go .roof,#inroom.go .inbar{animation:fadein .5s ease both}
@keyframes floorin{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}
.rh{display:flex;align-items:center;gap:7px;cursor:pointer;min-width:0}
.rh .fl{font:700 9.5px var(--mono);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 50%,transparent);border-radius:5px;padding:1px 5px;flex:none}
.rh b{font:700 14px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rh .tag{flex:none;margin-left:0}
.rh .sh{margin-left:auto;font:500 10.5px var(--mono);color:var(--dim);white-space:nowrap;flex:none}
.room.on .rh .sh{color:var(--win)}
.rs{display:grid;grid-template-columns:clamp(58px,19%,84px) minmax(0,1fr);gap:8px;align-items:end;margin:6px 0}
.tray{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-width:0;min-height:22px;margin-top:7px}
.tray.out{margin:0 0 7px}
.tl{font:700 8.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);width:24px;flex:none}
.tray.in .tl:after{content:" ↓"}.tray.out .tl:after{content:" ↓"}
.dc{display:block;max-width:100%;font:500 10.5px/1.25 var(--disp);color:#D7DFEC;background:#0F172A;border:1px solid color-mix(in srgb,var(--d) 55%,transparent);border-left:2.5px solid var(--d);border-radius:5px;padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tray.out .dc{border-left:1px solid color-mix(in srgb,var(--d) 55%,transparent);border-bottom:2.5px solid var(--d)}
.dc.pt{border-style:dashed;color:#CFF5FF}
.room.on .tray.in .dc{animation:docin 5.2s ease-in-out infinite}
.room.on .tray.out .dc{animation:docout 5.2s ease-in-out infinite}
@keyframes docin{0%{opacity:0;transform:translateY(-12px)}12%,72%{opacity:1;transform:none}90%,100%{opacity:.3;transform:translateY(7px)}}
@keyframes docout{0%,24%{opacity:.25;transform:translateY(-7px)}38%,82%{opacity:1;transform:none}100%{opacity:0;transform:translateY(12px)}}
.room:not(.on) .dc{opacity:.5}
.dm{font:500 10px/1.3 var(--mono);color:var(--dim2)}
.dm b{color:var(--c);font-weight:700;cursor:pointer}
.wkc,.hol{cursor:pointer}
.wk{display:block;width:100%;height:auto;overflow:visible}
.wk.hot .arms{animation:typ .28s ease-in-out infinite alternate}.wk.hot .arms.a2{animation-delay:.14s}
.wk.lit .arms,.wk.probation .arms,.wk.understudy .arms{animation:typ .7s ease-in-out infinite alternate}.wk.lit .arms.a2{animation-delay:.35s}
.wk.hot .torso{animation:lean 2.2s ease-in-out infinite}.wk.lit .torso,.wk.probation .torso,.wk.understudy .torso{animation:lean 4s ease-in-out infinite}
.wk.hot .visor,.wk.lit .visor{animation:flk 2.4s steps(2) infinite}
.wk .beam2{animation:pl 2.2s infinite}
.wk .zz{animation:zz 2.8s ease-in-out infinite}.wk .z2{animation-delay:.9s}
@keyframes typ{to{transform:translateY(1.7px)}}
@keyframes lean{50%{transform:translate(.7px,.5px)}}
@keyframes zz{0%{opacity:0;transform:translate(0,3px)}40%{opacity:.9}100%{opacity:0;transform:translate(3px,-5px)}}
.holo{display:block;width:100%;height:auto;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--c) 35%,transparent))}
.holo:not(.on){opacity:.55;filter:none}
.holo .gx,.holo .gy,.holo .sh{transform-box:fill-box}
.holo .gx{animation:growx .8s cubic-bezier(.2,.8,.2,1) both}
.holo .gy{transform-origin:center bottom;animation:growy .7s cubic-bezier(.2,.8,.2,1) both;fill-opacity:.8}
.holo .gy.sh{animation:growy .7s cubic-bezier(.2,.8,.2,1) both,shim 3.4s ease-in-out infinite}
.holo .fi{animation:fadein .5s ease both}
.holo .dr{stroke-dasharray:1;stroke-dashoffset:1;animation:drawp 1.3s ease-out .15s forwards}
.holo .ga{stroke-dasharray:var(--v) 1;stroke-dashoffset:var(--v);animation:drawp 1.1s cubic-bezier(.2,.8,.2,1) .15s forwards}
.holo .pu{animation:pl 1.5s infinite}
.holo .dp{animation:dropin .5s cubic-bezier(.2,.8,.2,1) both}
.holo .scan{animation:scan calc(var(--n)*1.1s) steps(var(--n)) infinite}
@keyframes growx{from{transform:scaleX(0)}to{transform:none}}
@keyframes growy{from{transform:scaleY(0)}to{transform:none}}
@keyframes shim{0%,100%{fill-opacity:.8}50%{fill-opacity:.45}}
@keyframes dropin{from{opacity:0;transform:translateY(-9px)}to{opacity:1;transform:none}}
@keyframes scan{to{transform:translateY(calc(var(--n)*8.6px))}}
.act{display:flex;gap:7px;align-items:flex-start;font-size:13px;line-height:1.35;color:#D7DFEC;min-height:35px;border-top:1px solid var(--line);padding-top:7px}
.act i{width:6px;height:6px;border-radius:50%;background:var(--dim2);margin-top:5px;flex:none}
.room.on .act i{background:var(--c);box-shadow:0 0 8px var(--c);animation:pl 1.3s infinite}
.act span{transition:opacity .24s;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.act span.swap{opacity:0}
.room:not(.on) .act{color:var(--dim)}
.nextb{appearance:none;width:100%;margin-top:2px;border:1px solid color-mix(in srgb,var(--c) 60%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 16%,transparent),transparent);color:var(--text);font:600 13.5px var(--disp);border-radius:12px;padding:12px;text-align:left}
@media (min-width:760px){.floors{grid-template-columns:1fr 1fr;gap:10px;align-items:start}}
@media (max-width:359px){.dc{font-size:9.5px}.rh b{font-size:13px}}
@media (min-width:700px){.pane{max-height:64vh}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg class="atom" viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke-width="1.4"><ellipse cx="20" cy="20" rx="17" ry="6.5" stroke="#7FE3FF"/><ellipse cx="20" cy="20" rx="17" ry="6.5" stroke="#A78BFA" transform="rotate(60 20 20)"/><ellipse cx="20" cy="20" rx="17" ry="6.5" stroke="#E5C158" transform="rotate(120 20 20)"/></g><circle cx="20" cy="20" r="3.2" fill="#fff"/></svg>
      <div><h1 id="cname">PERSEVERANCE HOLDINGS</h1><small id="cdist">Quantum District</small></div>
    </div>
    <a class="back" href="./">← Dashboard</a>
  </header>
  <div class="ribbon" id="ribbon"></div>
  <div class="seg" id="seg">
    <button data-v="live" class="on">Live<small>NOW</small></button>
    <button data-v="trace">Trace a bet<small>PATH</small></button>
    <button data-v="coh">Coherence<small>HEALTH</small></button>
    <button data-v="growth" disabled>Growth<small>SOON</small></button>
  </div>
  <div class="clock" id="clock"><span class="pulse"></span><span>Synchronising…</span></div>
  <div id="now" role="button" aria-label="What a desk is doing right now"></div>
  <div class="stage" id="stage"><div class="loading">Materialising the city…</div></div>
  <div class="legend" id="legend"></div>
  <div class="ticker" id="ticker"></div>
</div>
<div class="sheet"><div class="pane" id="pane"></div></div>
<script src="city.js"></script>
</body>
